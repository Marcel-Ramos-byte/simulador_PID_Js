<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Controle PID Responsivo</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>

  <div class="container">

    <header>
      <h1>Simulação de Controle PID</h1>
    </header>

    <section class="painel-controle">
      <div class="inputs">
        <label>Setpoint (%):
          <input type="number" id="setpointInput" value="80" min="10" max="100">
        </label>
        <label>Kp:
          <input type="number" id="kpInput" value="0.5" step="0.1" min="0.1" max="5">
        </label>
        <label>Ki:
          <input type="number" id="kiInput" value="0.1" step="0.1" min="0" max="5">
        </label>
        <label>Kd:
          <input type="number" id="kdInput" value="0.05" step="0.01" min="0" max="5">
        </label>
        <div class="checkboxes">
          <label><input type="checkbox" id="pCheck" checked> P</label>
          <label><input type="checkbox" id="iCheck"> I</label>
          <label><input type="checkbox" id="dCheck"> D</label>
        </div>
      </div>
      <button id="botaoControle">Próximo: Escolha o Setpoint</button>
    </section>

    <section class="painel-sistema">
      <div class="fluxograma">
        <div id="entrada" class="bloco">Entrada</div>
        <div class="seta">→</div>
        <div id="controlador" class="bloco">Controlador</div>
        <div class="seta">→</div>
        <div id="atuador" class="bloco">Bomba</div>
        <div class="seta">→</div>
        <div id="processo" class="bloco">Tanque</div>
        <div class="seta">→</div>
        <div id="saida" class="bloco">Nível</div>
        <div class="seta">↺</div>
        <div id="feedback" class="bloco">Feedback</div>
      </div>

      <div class="tanque-container">
        <div class="tanque">
          <div id="agua" class="agua"></div>
        </div>
        <div id="nivel">Nível: 0%</div>
      </div>

      <canvas id="grafico" width="400" height="200"></canvas>

      <div id="explicacao" class="explicacao">
        Ajuste os parâmetros, selecione P/I/D e clique no botão para iniciar.
      </div>
    </section>

  </div>

  <script src="script.js"></script>
</body>
</html>
